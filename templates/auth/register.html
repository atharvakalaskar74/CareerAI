{% extends "base.html" %}

{% block title %}Create Account — CareerAI{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 2rem auto;">
  <div class="card">
    <div style="text-align: center; margin-bottom: 2rem;">
      <div class="brand-icon" style="margin: 0 auto 1rem; width: 44px; height: 44px; font-size: 1.3rem;">⚡</div>
      <h1 style="font-size: 1.75rem; font-weight: 800;">Create Student Profile</h1>
      <p style="color: var(--text-muted); font-size: 0.9rem; margin-top: 0.25rem;">Join CareerAI to unlock personalized recommendations and skill analytics</p>
    </div>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <div class="grid grid-2" style="gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="username">Username *</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="john_doe" required autofocus>
        </div>

        <div class="form-group">
          <label class="form-label" for="full_name">Full Name</label>
          <input type="text" id="full_name" name="full_name" class="form-control" placeholder="John Doe">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">College Email *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="student@university.edu" required>
      </div>

      <div class="grid grid-2" style="gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="college">College / University</label>
          <input type="text" id="college" name="college" class="form-control" placeholder="National Institute of Tech">
        </div>

        <div class="form-group">
          <label class="form-label" for="degree">Degree / Branch</label>
          <input type="text" id="degree" name="degree" class="form-control" placeholder="B.Tech CSE (AI & ML)">
        </div>
      </div>

      <div class="grid grid-2" style="gap: 1rem;">
        <div class="form-group">
          <label class="form-label" for="password">Password *</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Min. 6 characters" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirm_password">Confirm Password *</label>
          <input type="password" id="confirm_password" name="confirm_password" class="form-control" placeholder="Repeat password" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Create Account</button>
    </form>

    <div style="text-align: center; margin-top: 1.75rem; font-size: 0.88rem; color: var(--text-muted);">
      Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary); text-decoration: none; font-weight: 600;">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
